
version: '3.8'

services:
  kpi-sync-app:
    build: ./app
    container_name: kpi_sync_service
    restart: always
    ports:
      - "5020:5000"  # ใช้ 5020 แทน เพื่อไม่ให้ชนกับระบบอื่นที่มีอยู่
    env_file: .env
    volumes:
      - ./app:/app
      - ./data:/app/data
    networks:
      - postgresql_default

networks:
  postgresql_default:
    external: true